services:
  # Single public entry on port 80. Routes: / → web, /admin → admin, /api → Spring.
  # Internal services are not published to the host; only Nginx + DB (optional) are.
  nginx:
    image: nginx:1.27-alpine
    container_name: vektra-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - admin
      - backend

  mysql:
    image: mysql:8.4
    container_name: vektra-mysql
    environment:
      MYSQL_DATABASE: vektra
      MYSQL_ROOT_PASSWORD: root
    # Host 3308 avoids clashing with a local MySQL on 3306 and a leaked-port reservation
    # we have seen on 3307 from Docker Desktop on Windows. Inside Compose, backend still uses mysql:3306.
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vektra-backend
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/vektra?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8080
        NEXT_PUBLIC_API_URL: /api
    container_name: vektra-web
    expose:
      - "3000"
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend

  admin:
    build:
      context: ../apps/admin
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://backend:8080
        NEXT_PUBLIC_API_URL: /api
    container_name: vektra-admin
    expose:
      - "3000"
    environment:
      BACKEND_URL: http://backend:8080
    depends_on:
      - backend

volumes:
  mysql_data:
