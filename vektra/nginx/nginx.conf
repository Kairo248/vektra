# =============================================================================
# Vektra — Nginx reverse proxy (single public entry)
# =============================================================================
# A reverse proxy terminates the client TCP connection and opens a new one
# to your apps. Clients only talk to Nginx; they never hold connections to
# Node or Spring directly. That gives you TLS termination, routing, rate
# limits, caching, and a stable public URL while internals stay private.
#
# Docker Compose DNS: names `web`, `admin`, `backend` resolve to container IPs
# on the Compose network. Use service names, not localhost, inside containers.
# =============================================================================

worker_processes auto;
# One worker per CPU is a common default; `auto` lets Nginx pick a sensible count.

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    # Max simultaneous connections per worker (not the same as requests/sec).
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Reasonable default if you later POST JSON or small uploads through /api
    client_max_body_size 10m;

    # Gzip reduces bytes on slow links; safe defaults for text responses
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name _;
        # `_` is a catch-all server_name inside the container (any Host header).

        # Docker Compose embedded DNS. Using a variable in `proxy_pass` defers name
        # resolution to request time so `nginx -t` does not require peers to exist.
        # (Static `upstream { server web:3000; }` fails `nginx -t` before containers run.)
        resolver 127.0.0.11 ipv6=off valid=10s;

        # --- Spring Boot API (context-path is /api on the JVM) ----------------
        # Browser calls same-origin http://host/api/... ; Nginx forwards the full
        # URI unchanged. That differs from /spring-api rewrites in Next dev, where
        # the browser hit Node first; here the browser hits Nginx, then Java.
        location /api {
            set $vektra_api_upstream backend:8080;
            proxy_http_version 1.1;
            proxy_pass http://$vektra_api_upstream;
            # No path after the host:port → Nginx passes the original URI (/api/...).

            proxy_set_header Host $host;
            # Preserves the public Host the user typed (e.g. localhost) so apps
            # can build correct absolute URLs if they read Host.

            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Spring (server.forward-headers-scheme) can trust these to know HTTPS
            # and client IP when you later put TLS on Nginx or a cloud LB.

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # --- Admin Next.js (built with basePath /admin) ----------------------
        location /admin {
            set $vektra_admin_upstream admin:3000;
            proxy_http_version 1.1;
            proxy_pass http://$vektra_admin_upstream;
            # Next expects paths like /admin, /admin/_next/..., /admin/login.

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Next.js HMR is not used in production; these help if you ever proxy dev
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # --- Public web Next.js (served at /) -------------------------------
        location / {
            set $vektra_web_upstream web:3000;
            proxy_http_version 1.1;
            proxy_pass http://$vektra_web_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
