# JDBC URL for Docker: set SPRING_DATASOURCE_URL (e.g. jdbc:mysql://mysql:3306/vektra?...).
# Username/password: application.yml + optional application-local.yml, or SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD env (see docker-compose.yml).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/vektra?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}